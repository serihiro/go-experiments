version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - godox
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: The io/ioutil package has been deprecated since Go 1.16.
    godox:
      keywords:
        - TODO
    revive:
      rules:
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
      print-linter-name: true

run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly
  go: "1.26.4"

severity:
  default: error
